apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../dynamo/dgd-efficient-colocated.yaml
- ../../dynamo/dgd-capable.yaml
- ../../router/colocated-service.yaml
patches:
- target:
    group: nvidia.com
    version: v1beta1
    kind: DynamoGraphDeployment
  patch: |-
    - op: replace
      path: /spec/components/1/podTemplate/spec/containers/0/env/2/value
      value: enabled
    - op: replace
      path: /spec/components/1/podTemplate/spec/containers/0/env/3/value
      value: "1"
